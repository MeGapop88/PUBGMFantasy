<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PUBG Mobile Global Open — Tactical Fantasy & Match Predictions Platform." />
    <title>PMGO — Tactical Protocol</title>

    <!-- Google Fonts: Archivo Narrow & Geist -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,600;0,700;1,700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Google Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#0A0A0B',
              surface: '#131314',
              'surface-dim': '#131314',
              'surface-bright': '#3a393a',
              'surface-container-lowest': '#0e0e0f',
              'surface-container-low': '#1c1b1c',
              'surface-container': '#1A1A1C',
              'surface-container-high': '#2a2a2b',
              'surface-container-highest': '#353436',
              primary: '#FF6B00',
              'primary-bright': '#FF6B00',
              'primary-container': '#FF6B00',
              'on-primary': '#000000',
              'on-surface': '#e5e2e3',
              'on-surface-variant': '#e2bfb0',
              outline: '#a98a7d',
              'outline-variant': '#2E2E32',
              'status-live': '#FF0000',
              'status-success': '#4cff72',
            },
            fontFamily: {
              headline: ['Archivo Narrow', 'sans-serif'],
              body: ['Geist', 'sans-serif'],
              label: ['Geist', 'sans-serif'],
              mono: ['Geist', 'monospace'],
            },
            borderRadius: {
              DEFAULT: '0px',
              none: '0px',
              sm: '0px',
              md: '0px',
              lg: '0px',
              xl: '0px',
              full: '9999px',
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="/src/css/design-system.css" />
    <link rel="stylesheet" href="/src/css/app.css" />
  </head>
  <body class="bg-background text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary selection:text-black">
    <div id="app" class="flex flex-col min-h-screen relative z-10">
      
      <!-- Top Navigation Bar (Always Visible) -->
      <nav id="navbar" class="sticky top-0 z-50 border-b border-outline-variant bg-[#0A0A0B]/95 backdrop-blur-md">
        <div class="max-w-[1600px] mx-auto px-4 md:px-8 h-[68px] flex items-center justify-between gap-6">
          
          <!-- Brand Logo & Badge -->
          <div class="flex items-center gap-6 shrink-0">
            <a href="#/dashboard" class="flex items-center gap-3 group">
              <span class="text-primary font-headline font-bold text-2xl tracking-tighter group-hover:scale-105 transition-transform flex items-center gap-1.5">
                <span class="text-primary text-xl">◈</span> PMGO
              </span>
              <span class="bg-primary/10 border border-primary/40 text-primary font-headline font-bold text-[10px] px-2 py-0.5 uppercase tracking-widest hidden sm:inline-block">
                TACTICAL PROTOCOL
              </span>
            </a>
          </div>

          <!-- Desktop Center Navigation Links -->
          <div class="hidden md:flex items-center gap-1 lg:gap-2 h-full" id="navbar-links">
            <a href="#/dashboard" class="nav-link px-3.5 lg:px-4 py-2 h-full font-headline font-bold text-sm tracking-wider uppercase flex items-center gap-2 text-outline hover:text-white transition-colors relative" data-page="dashboard">
              <span class="material-symbols-outlined text-lg">dashboard</span>
              <span>TOURNAMENT</span>
            </a>
            <a href="#/predictions" class="nav-link px-3.5 lg:px-4 py-2 h-full font-headline font-bold text-sm tracking-wider uppercase flex items-center gap-2 text-outline hover:text-white transition-colors relative" data-page="predictions">
              <span class="material-symbols-outlined text-lg">target</span>
              <span>PREDICTIONS</span>
            </a>
            <a href="#/fantasy" class="nav-link px-3.5 lg:px-4 py-2 h-full font-headline font-bold text-sm tracking-wider uppercase flex items-center gap-2 text-outline hover:text-white transition-colors relative" data-page="fantasy">
              <span class="material-symbols-outlined text-lg">groups</span>
              <span>FANTASY SQUAD</span>
            </a>
            <a href="#/leaderboard" class="nav-link px-3.5 lg:px-4 py-2 h-full font-headline font-bold text-sm tracking-wider uppercase flex items-center gap-2 text-outline hover:text-white transition-colors relative" data-page="leaderboard">
              <span class="material-symbols-outlined text-lg">leaderboard</span>
              <span>LEADERBOARD</span>
            </a>
            <a href="#/players" class="nav-link px-3.5 lg:px-4 py-2 h-full font-headline font-bold text-sm tracking-wider uppercase flex items-center gap-2 text-outline hover:text-white transition-colors relative" data-page="players">
              <span class="material-symbols-outlined text-lg">badge</span>
              <span>PLAYER ROSTER</span>
            </a>
          </div>

          <!-- Right: User Status / Controls -->
          <div class="flex items-center gap-4 shrink-0">
            
            <div id="top-nav-user" class="flex items-center gap-3">
              <!-- Dynamically populated by setupNav() -->
            </div>

            <!-- Mobile Hamburger Button -->
            <button class="md:hidden text-white p-2 border border-outline-variant bg-[#1A1A1C] hover:border-primary transition-colors" id="nav-hamburger" aria-label="Toggle navigation menu">
              <span class="material-symbols-outlined text-xl">menu</span>
            </button>
          </div>
        </div>

        <!-- Mobile Drawer Menu -->
        <div class="md:hidden hidden border-t border-outline-variant bg-[#131314] px-6 py-4 flex flex-col gap-2 shadow-2xl" id="nav-mobile-menu">
          <a href="#/dashboard" class="nav-mobile-link font-headline font-bold text-sm tracking-wider uppercase py-2.5 px-3 flex items-center gap-3 text-outline hover:text-primary hover:bg-[#1A1A1C] transition-colors" data-page="dashboard">
            <span class="material-symbols-outlined text-lg">dashboard</span> TOURNAMENT
          </a>
          <a href="#/predictions" class="nav-mobile-link font-headline font-bold text-sm tracking-wider uppercase py-2.5 px-3 flex items-center gap-3 text-outline hover:text-primary hover:bg-[#1A1A1C] transition-colors" data-page="predictions">
            <span class="material-symbols-outlined text-lg">target</span> PREDICTIONS
          </a>
          <a href="#/fantasy" class="nav-mobile-link font-headline font-bold text-sm tracking-wider uppercase py-2.5 px-3 flex items-center gap-3 text-outline hover:text-primary hover:bg-[#1A1A1C] transition-colors" data-page="fantasy">
            <span class="material-symbols-outlined text-lg">groups</span> FANTASY SQUAD
          </a>
          <a href="#/leaderboard" class="nav-mobile-link font-headline font-bold text-sm tracking-wider uppercase py-2.5 px-3 flex items-center gap-3 text-outline hover:text-primary hover:bg-[#1A1A1C] transition-colors" data-page="leaderboard">
            <span class="material-symbols-outlined text-lg">leaderboard</span> LEADERBOARD
          </a>
          <a href="#/players" class="nav-mobile-link font-headline font-bold text-sm tracking-wider uppercase py-2.5 px-3 flex items-center gap-3 text-outline hover:text-primary hover:bg-[#1A1A1C] transition-colors" data-page="players">
            <span class="material-symbols-outlined text-lg">badge</span> PLAYER ROSTER
          </a>
        </div>
      </nav>

      <!-- Main Layout (Full Width Canvas, Sidebar Removed) -->
      <main id="page-container" class="flex-1 w-full max-w-[1600px] mx-auto p-4 md:p-8 min-w-0"></main>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
